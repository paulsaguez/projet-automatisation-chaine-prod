<div class="page-container">
  <header>
    <button class="btn-back" routerLink="/">← Retour</button>
    <h1>Intégration de Données</h1>
    <p>Importez vos fichiers CSV et suivez l'avancement</p>
  </header>

  <main>
    <div class="upload-area">
      <div class="file-drop-zone">
        <span class="icon">📂</span>
        <p>Glissez votre fichier CSV ici ou cliquez pour parcourir</p>
        <input type="file" (change)="onFileSelected($event)" accept=".csv" />
      </div>
    </div>

    <div class="messages-area" *ngIf="messages.length > 0">
      <h3>Journal d'activité</h3>
      <ul>
        <li *ngFor="let msg of messages">{{ msg }}</li>
      </ul>
    </div>
  </main>
</div>
